spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
server.address=0.0.0.0
server.port=${PORT:8080}

# Configuración JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# Otros ajustes
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Define JWT_SECRET en el entorno. No uses el valor de desarrollo anterior en producción.
application.security.jwt.secret=${JWT_SECRET:change-me-in-environment}

logging.level.root=ERROR

# a year
application.security.jwt.expiration=${JWT_EXPIRATION:31536000000}

spring.main.allow-bean-definition-overriding=true

# CORS
app.allowed.origin-patterns=${CORS_ALLOW:*}

# Main printer name
app.printer.name=${PRINTER_NAME:POS-58}

# File upload
file.upload-dir=${UPLOAD_DIR:uploads}

# File upload configurations
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
